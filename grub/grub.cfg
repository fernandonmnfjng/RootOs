# RootOS v0.47.6-3 hardware boot menu.
#
# Normal boot uses bounded hardware discovery.
# Full probe diagnostics intentionally enables experimental/aggressive probes.
# Safe boot avoids hardware discovery completely.

set timeout=5
set default=0

insmod all_video

set gfxmode=1024x768x32,auto
set gfxpayload=keep

menuentry "RootOS" {
    echo "Loading RootOS..."
    multiboot /boot/kernel.elf rootos.boot=normal
    module /boot/driverpack.rdp driverpack
    boot
}

menuentry "RootOS (safe boot)" {
    echo "Loading RootOS safe mode..."
    multiboot /boot/kernel.elf rootos.boot=safe
    boot
}

menuentry "RootOS (hardware probe diagnostics)" {
    echo "Loading RootOS with full hardware probes..."
    multiboot /boot/kernel.elf rootos.boot=normal rootos.probe=full
    module /boot/driverpack.rdp driverpack
    boot
}

menuentry "RootOS (UEFI video diagnostics)" {
    set debug=video
    echo "Loading RootOS with GRUB GOP diagnostics..."
    multiboot /boot/kernel.elf rootos.boot=safe rootos.video=diagnostic
    boot
}
