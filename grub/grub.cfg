# RootOS v0.47.6-1 hardware boot menu.
# GOP framebuffer is kept for the 32-bit RootOS graphical terminal.

set timeout=5
set default=0

insmod all_video

# Prefer a conservative mode on physical UEFI machines and fall back to any
# mode GRUB can provide when 1024x768x32 is unavailable.
set gfxmode=1024x768x32,auto
set gfxpayload=keep

menuentry "RootOS (normal hardware boot)" {
    echo "Loading RootOS kernel..."
    multiboot /boot/kernel.elf rootos.boot=normal
    echo "Loading RootOS driver pack..."
    module /boot/driverpack.rdp driverpack
    echo "Starting RootOS..."
    boot
}

menuentry "RootOS (safe boot - no hardware probes)" {
    echo "Loading RootOS kernel in safe mode..."
    multiboot /boot/kernel.elf rootos.boot=safe
    echo "Starting RootOS safe mode..."
    boot
}

menuentry "RootOS (UEFI video diagnostics)" {
    set debug=video
    echo "Loading RootOS kernel with GRUB GOP diagnostics..."
    multiboot /boot/kernel.elf rootos.boot=safe rootos.video=diagnostic
    echo "Starting RootOS diagnostic mode..."
    boot
}
